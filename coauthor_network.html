<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coauthors | William Grieser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;--panel:#12151d;--line:#232838;--muted:#5d6480;--text:#9aa1b6;--light:#cdd2df;--white:#eef1f7;--amber:#e07830;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--amber);color:var(--bg)}
html,body{background:var(--bg)}
body{font-family:'Source Serif 4',Georgia,serif;color:var(--text);min-height:100vh}
a{color:inherit}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100vh}
.stage{position:relative;display:flex;flex-direction:column;padding:28px 32px 20px;height:100vh}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-family:'Fraunces',serif;font-weight:800;font-size:30px;letter-spacing:-.6px;color:var(--white)}
.back{font-size:15px;color:var(--amber);text-decoration:none;border-bottom:1px solid transparent}
.back:hover,.back:focus-visible{border-bottom-color:var(--amber)}
.lede{margin-top:6px;font-size:15px;color:var(--muted);max-width:60ch;line-height:1.5}
.chart{flex:1;min-height:0;position:relative}
svg{position:absolute;inset:0;display:block;cursor:grab}
svg:active{cursor:grabbing}
.themes{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;padding-top:6px}
.theme{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);background:none;border:0;cursor:pointer;padding:4px 2px;font-family:inherit}
.theme i{width:16px;height:3px;border-radius:2px;display:block}
.theme[aria-pressed="true"]{color:var(--white)}
.theme:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}
.dim .theme:not([aria-pressed="true"]){opacity:.45}

/* graph */
.spoke{fill:none;stroke:var(--amber);stroke-linecap:round;transition:stroke-opacity .2s}
.tie{fill:none;stroke-linecap:round;transition:stroke-opacity .2s}
.node .dot{fill:var(--bg);stroke-width:2}
.node text{font-family:'Source Serif 4',serif;fill:var(--light);transition:fill .2s, opacity .2s}
.node{cursor:grab;transition:opacity .2s}
.node text{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node:focus{outline:none}
.node:focus-visible .dot{stroke:var(--white)}
.node.on text{fill:var(--white);font-weight:600}
.faded{opacity:.14}
.center-name{font-family:'Fraunces',serif;font-weight:800;fill:var(--amber);font-size:24px}
.center-sub{font-family:'Source Serif 4',serif;font-style:italic;fill:var(--muted);font-size:14px}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--panel);padding:32px 28px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.p-name{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.15;color:var(--white)}
.p-inst{margin-top:4px;font-size:15px;color:var(--muted)}
.p-quote{margin-top:18px;font-style:italic;font-size:16px;line-height:1.6;color:var(--light)}
.p-site{display:inline-block;margin-top:16px;font-size:15px;color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(224,120,48,.4)}
.p-site:hover,.p-site:focus-visible{border-bottom-color:var(--amber)}
.p-h{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-family:'Fraunces',serif;font-size:16px;color:var(--white)}
.papers{list-style:none;margin-top:10px}
.papers li{padding:9px 0 9px 14px;border-left:3px solid var(--c);margin-bottom:6px}
.papers .t{font-size:15px;line-height:1.35;color:var(--light)}
.p-link{text-decoration:none;border-bottom:1px solid var(--line)}
.p-link:hover,.p-link:focus-visible{border-bottom-color:var(--amber)}
.papers .j{font-size:13px;color:var(--muted);margin-top:2px}
.papers .w{font-size:13px;color:var(--muted);margin-top:2px;font-style:italic}
.p-intro{font-size:16px;line-height:1.6;color:var(--text)}
.stats{display:flex;gap:28px;margin-top:22px}
.stat b{display:block;font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--white);line-height:1}
.stat span{font-size:14px;color:var(--muted)}
.hint{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.5}
.close{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .stage{padding:20px 16px 8px}
  h1{font-size:26px}
  .stage{height:auto}
  .chart{flex:none;height:min(115vw,640px)}
  .panel{position:static;max-height:none;border-left:0;border-top:1px solid var(--line);padding:24px 16px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="stage">
    <div class="top">
      <h1>Coauthors</h1>
      <a class="back" href="https://billygrieser.com">Back to billygrieser.com</a>
    </div>
    <p class="lede">The people I write papers with. Lines connect people who have written together, and thicker lines mean more papers.</p>
    <div class="chart"><svg id="graph" role="img" aria-label="Coauthor network"></svg></div>
    <div class="themes" id="themes"></div>
  </main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script>
/* ===== DATA: edit A (people) and P (papers) below ===== */
const TH={"Network Econometrics":"#5a8ef5","Corporate Investment":"#2dd4bf","Corporate Finance":"#e07830","Accounting & Fraud":"#e8637a","LLM Research":"#a855f7","Econometrics":"#4ade80"};
const A={
"Billy":{f:"William",l:"Grieser",inst:"Oklahoma State University",url:"https://billygrieser.com",q:"",c:true},
"Morad":{f:"Morad",l:"Zekhnini",inst:"Michigan State University",url:"https://sites.google.com/view/moradzekhnini/home",q:"The smartest person I\u2019ve ever met, and humble about it. He doesn\u2019t solve differential equations \u2014 he knows the answer, and the math reverse-engineers the truth."},
"Charlie":{f:"Charles",l:"Hadlock",inst:"University of Pittsburgh",url:"https://www.business.pitt.edu/professors/charles-hadlock/",q:"My dissertation advisor. The brain to win a Nobel Prize, and the humility to let you think you came up with the idea yourself."},
"Jim":{f:"James",l:"LeSage",inst:"Texas State (Emeritus)",url:"https://scholar.google.com/citations?user=9UI5bRAAAAAJ&hl=en",q:"My mentor, and one of the godfathers of spatial econometrics. If you want to know what\u2019s wrong with your model, see Jim. Except he\u2019s retired now, so good luck."},
"Eshwar":{f:"Eshwar",l:"Venugopal",inst:"University of Alabama",url:"https://eshwarv.com",q:"The nicest man on the planet, and he knows the literature better than Google Scholar."},
"Maryam":{f:"Maryam",l:"Fathollahi",inst:"University of Oklahoma",url:"https://www.maryamfathollahi.com",q:"You think you\u2019re careful at research. Then you meet Maryam, and you realize you\u2019ve been coloring outside the lines your whole career."},
"Ioannis":{f:"Ioannis",l:"Spyridopoulos",inst:"American University",url:"https://ioannisspy.github.io",q:"The hardest worker I\u2019ve ever met. And sometimes, it\u2019s even useful."},
"Audra":{f:"Audra",l:"Boone",inst:"Colorado State University",url:"https://sites.google.com/site/audralboone/",q:"Detail-oriented, encyclopedic on institutional knowledge, and the nicest person anyone has ever met. Yes, I said that about Eshwar too. They\u2019re both right."},
"Rachel":{f:"Rachel",l:"Li",inst:"U.S. Securities and Exchange Commission",url:"https://sites.google.com/view/rachelli/home",q:"She\u2019ll keep you in line one minute and bring the joy to the lunch table the next."},
"Parth":{f:"Parth",l:"Venkat",inst:"U.S. Securities and Exchange Commission",url:"https://parthvenkat.com",q:"Dos Equis has it wrong. Parth is the most interesting man in the world."},
"Zack":{f:"Zack",l:"Liu",inst:"University of Houston",url:"https://www.zackliu.info",q:"A careful thinker with a calm demeanor. I was invited to his wedding \u2014 that\u2019s how you know it\u2019s real."},
"Patrick":{f:"Patrick",l:"Hopkins",inst:"Kansas State University",url:"https://cba.k-state.edu/about/faculty-staff/directory/Hopkins-Patrick.html",q:"My best friend. He knows more about me than I know about myself, and still picks up the phone."},
"Stephen":{f:"Stephen",l:"Lusch",inst:"University of Kentucky",url:"https://gatton.uky.edu/people/stephen-lusch",q:"Too smart to be in academia, too funny not to be a comedian. Ended up doing both."},
"Jan":{f:"Jan",l:"Ditzen",inst:"Free University of Bozen-Bolzano",url:"https://sites.google.com/site/jandger87/home",q:"The man who makes econometrics fun \u2014 and then you realize just how little you knew about it before you met him."},
"Josh":{f:"Josh",l:"Pierce",inst:"University of Alabama",url:"https://culverhouse.ua.edu/people/josh-pierce/",q:"Too humble for his own good, and the man to go to for advice on almost any topic. Almost."},
"Tony":{f:"Tony",l:"Cookson",inst:"University of Colorado Boulder",url:"https://www.tonycookson.com",q:"It\u2019s tough to say whether he\u2019s transformed CrossFit or finance research more. But he\u2019s not done leaving his mark on either."},
"Gonzalo":{f:"Gonzalo",l:"Maturana",inst:"Emory University",url:"https://www.gonzalomaturana.com",q:"A black belt in MMA, a gold belt in research, and a platinum belt in my heart."},
"JungHoon":{f:"Jung Hoon",l:"Lee",inst:"Yonsei University",url:"https://sites.google.com/view/junghoonl/home",q:"Quiet precision. Every insight he offers makes the paper better."},
"Santiago":{f:"Santiago",l:"Truffa",inst:"ESE Business School",url:"https://santiagotruffa.cl",q:"The theorist who makes you love math, and the math loves him back."},
"Weston":{f:"James",l:"Weston",inst:"Rice University",url:"https://www.ruf.rice.edu/~westonj/",q:"The man I want to think like."}
};
const P=[
{a:["Billy","Morad","Charlie","Jim"],t:"Network Effects in Corporate Financial Policies",j:"JFE 2022",th:"Network Econometrics"},
{a:["Billy","Morad","Jim"],t:"Industry Networks and the Geography of Firm Behavior",j:"Management Science 2022",th:"Network Econometrics"},
{a:["Billy","Morad","Ioannis"],t:"The Epidemiology of Financial Constraints",j:"JFQA 2026",th:"Corporate Investment"},
{a:["Billy","Morad","JungHoon"],t:"Ubiquitous Comovement",j:"R&R Mgmt Science",th:"Network Econometrics"},
{a:["Billy","Morad","Jan"],t:"Network Econometrics Suite (Python)",j:"Software",th:"Econometrics"},
{a:["Billy","Charlie"],t:"Panel Data Estimation in Finance",j:"JFQA 2019",th:"Econometrics"},
{a:["Billy","Charlie","Josh"],t:"Doing Good When Doing Well",j:"Rev Acct Studies 2021",th:"Accounting & Fraud"},
{a:["Billy","Eshwar","Maryam"],t:"The Topology of Corporate Risk",j:"Working Paper",th:"Corporate Finance"},
{a:["Billy","Eshwar","Maryam"],t:"Managing Unhedgeable Risks",j:"Working Paper",th:"Corporate Finance"},
{a:["Billy","Ioannis","Gonzalo","Santiago"],t:"Agglomeration, Coordination, and Corporate Investment",j:"JCF 2022",th:"Corporate Investment"},
{a:["Billy","Audra","Rachel","Parth"],t:"Product Similarity, Benchmarking, and Corporate Fraud",j:"JFQA 2025",th:"Accounting & Fraud"},
{a:["Billy","Zack"],t:"Corporate Investment and Innovation",j:"RFS 2019",th:"Corporate Investment"},
{a:["Billy","Zack"],t:"Product Market Competition and Investment",j:"Working Paper",th:"Corporate Investment"},
{a:["Billy","Patrick","Jan","Stephen"],t:"Decomposing Spillover Effects of Restatements",j:"JBFA 2026",th:"Accounting & Fraud"},
{a:["Billy","Jan"],t:"Spatial Econometrics in Stata",j:"Software",th:"Econometrics"},
{a:["Billy","Tony","Eshwar","Maryam"],t:"LLMs and Systematic Measurement Error",j:"Working Paper",th:"LLM Research"},
{a:["Billy","Patrick","Weston"],t:"Unfixing Fixed Effects",j:"Working Paper",th:"Econometrics"},
// papers I'm not on: drawn as dashed lines between coauthors. ext = coauthors without a node.
{a:["Patrick","Audra"],t:"Mitigating Acquisition Risk: The Critical Role of Indemnification during Merger Contracting",j:"Working Paper",ext:["Disen Huang Albrecht"],url:"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5124498"},
{a:["Stephen","Patrick"],t:"Will Travel for Packages: The Effect of Economic Nexus Standards on Cross-Border Package Delivery",j:"Working Paper",url:"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6330778"},
{a:["Patrick","Stephen"],t:"Sample Heterogeneity in Archival Accounting Research",j:"Working Paper",ext:["Karen K. Nelson"],url:"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4980493"},
{a:["Weston","Morad"],t:"Safe Minus Risky: Do Investors Pay a Premium for Stocks that Hedge Stock Market Downturns?",j:"Working Paper",ext:["Nishad Kapadia","Barbara Ostdiek"],url:"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2627848"},
{a:["Ioannis","Morad"],t:"The Role of Networks in Loan Syndicate Markets",j:"Working Paper",ext:["Jeffrey H. Harris","Celso Brunetti"],url:"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3295980"}
];

/* ===== END DATA ===== */

const ME="Billy";
const OTHER="#6b7190"; // color for papers I'm not on
const ids=Object.keys(A).filter(k=>k!==ME);
const mine=p=>p.a.includes(ME);
const papersOf=id=>P.filter(p=>p.a.includes(id)&&mine(p));
const otherPapersOf=id=>P.filter(p=>p.a.includes(id)&&!mine(p));
const titleOf=p=>p.t||"Joint paper";

// pairwise coauthor ties (excluding me), one per pair
const tieMap=new Map();
P.forEach(p=>{const o=p.a.filter(x=>x!==ME&&A[x]);for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){const k=[o[i],o[j]].sort().join("|");if(!tieMap.has(k))tieMap.set(k,{a:o[i],b:o[j],papers:[]});tieMap.get(k).papers.push(p)}});
const tieData=[...tieMap.values()].map(t=>({...t,withMe:t.papers.some(mine),color:(t.papers.find(mine)?TH[t.papers.find(mine).th]:OTHER)}));

const svg=d3.select("#graph");
const chartEl=document.querySelector(".chart");
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,mobile,FS;
function measure(){W=chartEl.clientWidth;H=chartEl.clientHeight;mobile=W<620;FS=mobile?11.5:13.5;svg.attr("width",W).attr("height",H).attr("viewBox",`0 0 ${W} ${H}`)}
measure();

const g=svg.append("g");
if(!mobile)svg.call(d3.zoom().scaleExtent([.5,3]).on("zoom",e=>g.attr("transform",e.transform))).on("dblclick.zoom",null);

const me={id:ME,center:true,x:W/2,y:H/2,fx:W/2,fy:H/2};
const nodes=ids.map((id,i)=>{const d=A[id];const ps=papersOf(id);const ang=i*2.39996,rr=20+4*Math.sqrt(i);
  return{id,x:W/2+rr*Math.cos(ang),y:H/2+rr*Math.sin(ang),first:d.f,last:d.l,inst:d.inst,url:d.url,quote:d.q,papers:ps,others:otherPapersOf(id),
    themes:[...new Set(ps.map(p=>p.th))],color:TH[ps[0]?.th]||OTHER,r:(mobile?4:5)+Math.min(ps.length,5)*1.6}});
const byId=Object.fromEntries(nodes.map(d=>[d.id,d]));byId[ME]=me;
const spokeData=nodes.map(d=>({source:me,target:d,n:d.papers.length}));
const ties=tieData.map(t=>({...t,source:byId[t.a],target:byId[t.b]}));

// layers
const spokes=g.append("g").selectAll("line").data(spokeData).join("line").attr("class","spoke")
  .attr("stroke-width",d=>.8+d.n*1.1).attr("stroke-opacity",.22);
const tieSel=g.append("g").selectAll("path").data(ties).join("path").attr("class","tie")
  .attr("stroke",t=>t.color).attr("stroke-width",t=>1.2+t.papers.length*1.1)
  .attr("stroke-dasharray",t=>t.withMe?null:"4 4").attr("stroke-opacity",.5);

const centerSel=g.append("g").attr("class","center");
centerSel.append("circle").attr("r",mobile?30:38).attr("fill","var(--bg)").attr("stroke","#e07830").attr("stroke-width",2);
centerSel.append("text").attr("class","center-name").style("font-size",(mobile?16:20)+"px").attr("text-anchor","middle").attr("y",mobile?2:1).text("Billy");
centerSel.append("text").attr("class","center-sub").style("font-size",(mobile?10:12)+"px").attr("text-anchor","middle").attr("y",mobile?15:17).text("Grieser");

const nodeSel=g.append("g").selectAll("g").data(nodes).join("g").attr("class","node")
  .attr("tabindex",0).attr("role","button").attr("aria-label",d=>`${d.first} ${d.last}, ${d.inst}`);
nodeSel.append("circle").attr("class","hit").attr("r",d=>d.r+10).attr("fill","transparent").attr("stroke","none");
nodeSel.append("circle").attr("class","dot").attr("r",d=>d.r).attr("stroke",d=>d.color);
nodeSel.append("text").style("font-size",FS+"px").attr("text-anchor","middle").attr("y",d=>d.r+FS+3)
  .text(d=>mobile?d.last:`${d.first} ${d.last}`);

// forces: people pulled toward me by how much we've written together, toward each other by shared papers
const sim=d3.forceSimulation([me,...nodes])
  .force("spoke",d3.forceLink(spokeData).distance(d=>(mobile?.36:.34)*Math.min(W,H)-d.n*6).strength(.25))
  .force("tie",d3.forceLink(ties).distance(mobile?60:90).strength(t=>t.withMe?.35:.12))
  .force("charge",d3.forceManyBody().strength(mobile?-160:-420))
  .force("collide",d3.forceCollide().radius(d=>d.center?(mobile?40:52):(mobile?26:48)))
  .force("x",d3.forceX(W/2).strength(.03)).force("y",d3.forceY(H/2).strength(.03));
if(reduce){sim.stop();for(let i=0;i<300;i++)sim.tick();}

function tiePath(t){const a=t.source,b=t.target;const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1;
  const off=Math.min(40,dist*.18);const mx=(a.x+b.x)/2-dy/dist*off,my=(a.y+b.y)/2+dx/dist*off;
  return`M${a.x},${a.y}Q${mx},${my} ${b.x},${b.y}`}
const pad=mobile?24:40;
function tick(){
  nodes.forEach(d=>{d.x=Math.max(pad,Math.min(W-pad,d.x));d.y=Math.max(pad,Math.min(H-pad-FS,d.y))});
  spokes.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  tieSel.attr("d",tiePath);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  centerSel.attr("transform",`translate(${me.x},${me.y})`);
}
sim.on("tick",tick);tick();

// drag (keeps the old feel: pull anyone around, they spring back into place)
let dragging=false;
nodeSel.call(d3.drag()
  .on("start",(e,d)=>{dragging=true;if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
  .on("end",(e,d)=>{dragging=false;if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
centerSel.style("cursor","grab").call(d3.drag()
  .on("start",e=>{if(!e.active)sim.alphaTarget(.25).restart()})
  .on("drag",e=>{me.fx=e.x;me.fy=e.y})
  .on("end",e=>{if(!e.active)sim.alphaTarget(0)}));

addEventListener("resize",()=>{const ow=W,oh=H;measure();me.fx+=(W-ow)/2;me.fy+=(H-oh)/2;
  sim.force("x",d3.forceX(W/2).strength(.03)).force("y",d3.forceY(H/2).strength(.03)).alpha(.3).restart()});

// ===== interaction =====
let pinned=null,activeTheme=null;
const panel=document.getElementById("panel");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function showIntro(){
  const nPapers=P.filter(mine).length;
  panel.innerHTML=`<p class="p-intro">Research is a team sport. These are the people who have made my papers better, and in most cases, my life better too.</p>
  <div class="stats"><div class="stat"><b>${nodes.length}</b><span>coauthors</span></div><div class="stat"><b>${nPapers}</b><span>projects</span></div></div>
  <p class="hint">Hover over a name to see our papers, or click to keep it open. Drag anyone around. Dashed lines are papers my coauthors wrote without me. Pick a research area below the graph to see who works on it.</p>`;
}
function showPerson(d){
  panel.innerHTML=`<div class="p-name">${esc(d.first)} ${esc(d.last)}</div><div class="p-inst">${esc(d.inst)}</div>
  ${d.quote?`<p class="p-quote">“${esc(d.quote)}”</p>`:""}
  ${d.url?`<a class="p-site" href="${esc(d.url)}" target="_blank" rel="noopener">Visit ${esc(d.first)}’s website</a>`:""}
  <div class="p-h">${d.papers.length===1?"Our paper":`Our ${d.papers.length} papers`}</div>
  <ul class="papers">${d.papers.map(p=>{const others=p.a.filter(x=>x!==ME&&x!==d.id).map(x=>A[x]?`${A[x].f} ${A[x].l}`:x);
    return`<li style="--c:${TH[p.th]}"><div class="t">${esc(p.t)}</div><div class="j">${esc(p.j)}</div>${others.length?`<div class="w">with ${esc(others.join(", "))}</div>`:""}</li>`}).join("")}</ul>
  ${d.others.length?`<div class="p-h">Other coauthor links</div><ul class="papers">${d.others.map(p=>{const w=[...p.a.filter(x=>x!==d.id).map(x=>A[x]?`${A[x].f} ${A[x].l}`:x),...(p.ext||[])];
    return`<li style="--c:${OTHER}"><div class="t">${p.url?`<a class="p-link" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(titleOf(p))}</a>`:esc(titleOf(p))}</div>${p.j?`<div class="j">${esc(p.j)}</div>`:""}<div class="w">with ${esc(w.join(", "))}</div></li>`}).join("")}</ul>`:""}`;
}
function highlight(d){
  const nb=new Set([d.id]);ties.forEach(t=>{if(t.a===d.id)nb.add(t.b);if(t.b===d.id)nb.add(t.a)});
  nodeSel.classed("faded",x=>!nb.has(x.id)).classed("on",x=>x.id===d.id);
  spokes.attr("stroke-opacity",x=>x.target.id===d.id?.75:nb.has(x.target.id)?.15:.05);
  tieSel.attr("stroke-opacity",t=>(t.a===d.id||t.b===d.id)?.9:.04);
}
function highlightTheme(th){
  const has=x=>x.themes.includes(th);
  nodeSel.classed("faded",x=>!has(x)).classed("on",false);
  spokes.attr("stroke-opacity",x=>has(x.target)?.5:.04);
  tieSel.attr("stroke-opacity",t=>t.papers.some(p=>mine(p)&&p.th===th)?.9:.03);
}
function reset(){
  nodeSel.classed("faded",false).classed("on",false);
  spokes.attr("stroke-opacity",.22);tieSel.attr("stroke-opacity",.5);
}
function restore(){
  if(pinned){highlight(pinned);showPerson(pinned)}
  else if(activeTheme){highlightTheme(activeTheme);showIntro()}
  else{reset();showIntro()}
}
nodeSel.on("mouseenter",(e,d)=>{highlight(d);showPerson(d)})
  .on("mouseleave",()=>{if(!dragging)restore()})
  .on("click",(e,d)=>{e.stopPropagation();pinned=pinned===d?null:d;setTheme(null,false);restore();
    if(pinned&&innerWidth<=900)panel.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})})
  .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pinned=pinned===d?null:d;setTheme(null,false);restore()}})
  .on("focus",(e,d)=>{highlight(d);showPerson(d)}).on("blur",restore);
svg.on("click",e=>{if(e.target===svg.node()){pinned=null;restore()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){pinned=null;setTheme(null)}});

// theme filters
const themesEl=document.getElementById("themes");
Object.entries(TH).forEach(([name,c])=>{const b=document.createElement("button");b.className="theme";b.setAttribute("aria-pressed","false");
  b.innerHTML=`<i style="background:${c}"></i>${name}`;b.onclick=()=>setTheme(activeTheme===name?null:name);themesEl.appendChild(b)});
function setTheme(th,apply=true){activeTheme=th;if(th)pinned=null;
  [...themesEl.children].forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===th)));
  themesEl.classList.toggle("dim",!!th);if(apply)restore()}

showIntro();
</script>
</body>
